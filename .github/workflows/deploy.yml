name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate store credentials without submitting"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=$(jq -r .version package.json)
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Validate store credentials (dry-run)
        run: |
          pnpm wxt submit --dry-run \
            --chrome-zip .output/*-chrome.zip \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Submit to Chrome Web Store
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run == true) }}
        continue-on-error: true
        id: chrome_submit
        run: |
          pnpm wxt submit \
            --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox Addon Store
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run == true) }}
        continue-on-error: true
        id: firefox_submit
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Check submission results
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run == true) }}
        run: |
          echo "Chrome submission: ${{ steps.chrome_submit.outcome }}"
          echo "Firefox submission: ${{ steps.firefox_submit.outcome }}"
          if [ "${{ steps.chrome_submit.outcome }}" == "failure" ] && [ "${{ steps.firefox_submit.outcome }}" == "failure" ]; then
            echo "::error::Both store submissions failed"
            exit 1
          elif [ "${{ steps.chrome_submit.outcome }}" == "failure" ]; then
            echo "::warning::Chrome submission failed, but Firefox succeeded"
          elif [ "${{ steps.firefox_submit.outcome }}" == "failure" ]; then
            echo "::warning::Firefox submission failed, but Chrome succeeded"
          else
            echo "::notice::Both submissions succeeded"
          fi

      - name: Create Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run == true) && (steps.chrome_submit.outcome == 'success' || steps.firefox_submit.outcome == 'success') }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
